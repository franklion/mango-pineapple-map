<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#f4f6ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171c17" media="(prefers-color-scheme: dark)">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>芒果鳳梨散步地圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 左側是故事欄（旅程清單／旅程詳情），右側是一張手繪感地圖；手機上地圖在上、故事在下。 */
:root {
  --paper: #f4f6ec;
  --paper-2: #e9eddc;
  --ink: #1f2a22;
  --ink-soft: #55604f;
  --line: #cdd4bd;
  --mango: #e8962a;
  --mango-ink: #8a4f06;
  --leaf: #3d7a4c;
  --stay: #3f74a6;
  --food: #d4593d;
  --play: #8a5cb8;
  --park: #3d7a4c;
  --move: #6b7466;
  --card: #fbfcf6;
  --sea: #dfe9e4;
  --sea-line: #c3d5cc;
  --land: #f3f1e4;
  --land-hover: #ebe8d4;
  --mango-soft: #fbe3bd;
  --tile-filter: none;
  --whale: #7ea6c2;
  --font-display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", "Noto Serif TC", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-3: 2.125rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171c17; --paper-2: #1f261f; --ink: #e8ecdf; --ink-soft: #a6b09c; --line: #364032;
    --mango: #f0a944; --mango-ink: #f6c27a; --leaf: #7bbf88; --stay: #79a8d6; --food: #ec8a6f;
    --play: #b892dd; --park: #7bbf88; --move: #9aa391; --card: #1c221c; --sea: #142226; --sea-line: #23383c; --land: #2a3227; --land-hover: #333d2f; --mango-soft: #4a3415; --tile-filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.7); --whale: #5b88a8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #171c17; --paper-2: #1f261f; --ink: #e8ecdf; --ink-soft: #a6b09c; --line: #364032;
  --mango: #f0a944; --mango-ink: #f6c27a; --leaf: #7bbf88; --stay: #79a8d6; --food: #ec8a6f;
  --play: #b892dd; --park: #7bbf88; --move: #9aa391; --card: #1c221c; --sea: #142226; --sea-line: #23383c; --land: #2a3227; --land-hover: #333d2f; --mango-soft: #4a3415; --tile-filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.7); --whale: #5b88a8; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: var(--step-0); line-height: 1.7;
}
.app {
  display: grid; grid-template-columns: minmax(0, 470px) minmax(0, 1fr);
  min-height: 100%;
}
.story {
  padding-block: 28px 40px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: 24px;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 24px; min-width: 0;
}
.stage {
  position: sticky; top: env(safe-area-inset-top, 0px);
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  padding: 24px;
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px; min-width: 0;
}
.mapbox {
  flex: 1; min-height: 0; border-radius: 18px; background: var(--paper-2);
  border: 1px solid var(--line); position: relative; overflow: hidden;
}
.mapbox svg { width: 100%; height: 100%; display: block; }
.mapbox.tw svg { overflow: visible; }
.map-note { font-size: var(--step--1); color: var(--ink-soft); }

header.brand { display: flex; flex-direction: column; gap: 6px; }
.brand h1 {
  font-family: var(--font-display); font-weight: 700; font-size: var(--step-3);
  line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: 0.02em;
}
.brand h1 .m { color: var(--mango-ink); }
.brand h1 .p { color: var(--leaf); }
.brand .tag { font-family: var(--font-display); font-size: var(--step-1); margin: 0; color: var(--ink); }
.brand .motto { margin: 0; color: var(--ink-soft); font-size: var(--step--1); max-width: 40ch; }

.section-label {
  font-size: var(--step--1); letter-spacing: 0.12em; color: var(--ink-soft);
  margin: 0; font-weight: 500;
}

.trip-list { display: flex; flex-direction: column; gap: 12px; list-style: none; margin: 0; padding: 0; }
.trip-card {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: start;
  text-align: left; width: 100%; font: inherit; color: inherit; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  transition: border-color .15s, transform .15s;
}
.trip-card:hover { border-color: var(--mango); transform: translateY(-1px); }
.trip-card:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--mango); outline-offset: 2px; }
.trip-card .stamp {
  grid-row: span 3; width: 52px; height: 52px; border-radius: 50%;
  border: 2px dashed var(--mango); color: var(--mango-ink);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.125rem;
}
.trip-card h3 { margin: 0; font-family: var(--font-display); font-size: var(--step-1); line-height: 1.35; }
.trip-card .meta { font-size: var(--step--1); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.trip-card .hook { margin: 0; font-size: var(--step--1); }

.empty-hint {
  font-size: var(--step--1); color: var(--ink-soft); border: 1px dashed var(--line);
  border-radius: 14px; padding: 14px 16px; margin: 0;
}

/* Trip detail */
.back {
  align-self: flex-start; font: inherit; font-size: var(--step--1); color: var(--ink-soft);
  background: none; border: 0; padding: 4px 0; cursor: pointer;
}
.back:hover { color: var(--ink); }
.trip-head { display: flex; flex-direction: column; gap: 8px; }
.trip-head .region { font-size: var(--step--1); color: var(--mango-ink); letter-spacing: 0.08em; margin: 0; font-weight: 500; }
.trip-head h2 { margin: 0; font-family: var(--font-display); font-size: var(--step-2); line-height: 1.3; text-wrap: balance; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.facts li {
  font-size: var(--step--1); padding: 2px 10px; border-radius: 999px;
  background: var(--paper-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums;
}
.lead { margin: 0; max-width: 62ch; }

.route { display: flex; flex-direction: column; gap: 10px; }
.route h3, .others h3 { margin: 0; font-family: var(--font-display); font-size: var(--step-1); }
.route .sub { margin: 0; font-size: var(--step--1); color: var(--ink-soft); }
.stops { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.stop {
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; position: relative;
}
.stop:not(:last-child)::before {
  content: ""; position: absolute; left: 16px; top: 34px; bottom: -2px;
  border-left: 2px dotted var(--mango);
}
.stop .dot {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 700; color: #fff; font-size: 0.95rem;
  position: relative; z-index: 1;
}
.place {
  font: inherit; color: inherit; text-align: left; width: 100%; cursor: pointer;
  background: transparent; border: 1px solid transparent; border-radius: 12px;
  padding: 4px 10px 14px; display: flex; flex-direction: column; gap: 4px;
}
.place { box-sizing: border-box; min-width: 0; }
.place p, .place .tip span { overflow-wrap: anywhere; }
.place:focus-visible { outline: 2px solid var(--mango); outline-offset: 2px; }
.place:hover { background: var(--card); border-color: var(--line); }
.place.active { background: var(--card); border-color: var(--mango); }
.place .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.place .name { font-weight: 700; font-size: var(--step-0); }
.kind {
  font-size: 0.75rem; padding: 0 8px; border-radius: 999px; color: #fff; letter-spacing: 0.05em; line-height: 1.6;
}
.place p { margin: 0; font-size: var(--step--1); color: var(--ink); }
.place .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.place .tags span {
  font-size: 0.75rem; color: var(--mango-ink); border: 1px solid var(--mango); border-radius: 999px; padding: 0 8px;
}
.place .addr { font-size: 0.75rem; color: var(--ink-soft); }
.place .gmap { font-size: 0.75rem; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 2px; }
.place .gmap:hover { color: var(--ink); }
.others { display: flex; flex-direction: column; gap: 10px; }
.other-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.other-list li { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; }

.story-box {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
  display: flex; flex-direction: column; gap: 6px;
}
.story-box h3 { margin: 0; font-family: var(--font-display); font-size: var(--step-1); color: var(--leaf); }
.story-box p { margin: 0; font-family: var(--font-display); font-size: 1.0625rem; line-height: 1.85; }


.place .nick { font-family: var(--font-display); font-size: var(--step--1); color: var(--leaf); }
.place .tip { font-size: 0.75rem; color: var(--mango-ink); }
.place .tags span.age { background: var(--leaf); border-color: var(--leaf); color: #fff; }
.blog-link { font-size: var(--step--1); color: var(--mango-ink); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; align-self: flex-start; }
.blog-link:hover { color: var(--ink); }
.howto { background: var(--paper-2); border-radius: 12px; padding: 12px 16px; }
.howto h4 { margin: 0 0 4px; font-family: var(--font-display); font-size: var(--step-0); }
.howto ul { margin: 0; padding-left: 1.2em; font-size: var(--step--1); display: flex; flex-direction: column; gap: 2px; }
.howto.tips { border: 1px dashed var(--mango); background: transparent; }
.story-box p + p { margin-top: 4px; }

.other-list .dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 700; }
.dot.wish { border: 2px dashed var(--ink-soft); color: var(--ink-soft) !important; }
.place .day { font-size: 0.75rem; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.lmk.wish .b { background: var(--card) !important; color: var(--ink-soft); border: 2px dashed var(--ink-soft); box-shadow: none; }
.lmk.wish .l { color: var(--ink-soft); font-weight: 500; border-style: dashed; }

.compact-labels .lmk .l { display: none; }
.compact-labels .lmk.active .l { display: block; }
@media (max-width: 820px) {
  .stage { height: 64vh; }
  .county-label { font-size: 13px; }
  .county-label.on { font-size: 15px; }
  .pin .flag text { font-size: 16px; }
  .cartouche .c-title { font-size: 15px; }
}
.map-loading { margin: 0; padding: 16px; color: var(--ink-soft); font-size: var(--step--1); }

/* 小圖示 */
.ic { width: 1.05em; height: 1.05em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.17em; }
.kind { display: inline-flex; align-items: center; gap: 3px; }
.kind .ic { width: 0.95em; height: 0.95em; stroke-width: 2; }
.facts li { display: inline-flex; align-items: center; gap: 5px; }
.facts .ic { color: var(--mango-ink); }
.route h3, .others h3, .story-box h3 { display: flex; align-items: center; gap: 6px; }
.route h3 .ic, .others h3 .ic { color: var(--mango-ink); }
.howto h4 { display: flex; align-items: center; gap: 5px; }
.place .tip { display: flex; gap: 4px; align-items: flex-start; }
.place .tip .ic { margin-top: 0.15em; }
.place .gmap, .blog-link { display: inline-flex; align-items: center; gap: 4px; }

/* 首頁動態：海浪漂、小船晃、鯨魚噴水、圖釘落下 */
.waves .w-a { animation: drift-l 9s linear infinite; }
.waves .w-b { animation: drift-r 12s linear infinite; }
@keyframes drift-l { to { transform: translateX(-20px); } }
@keyframes drift-r { from { transform: translateX(-20px); } to { transform: translateX(0); } }
.boat { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
.boat .hull { fill: var(--ink-soft); }
.boat .mast { stroke: var(--ink-soft); stroke-width: 1.2; }
.boat .sail { fill: var(--card); stroke: var(--ink-soft); stroke-width: 1; stroke-linejoin: round; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-2.5px) rotate(4deg); } }
.whale .body { fill: var(--whale); }
.whale .eye-w { fill: var(--card); }
.whale .spout { stroke: var(--whale); stroke-width: 1.4; stroke-linecap: round; fill: none; opacity: 0; animation: spout 4.5s ease-out infinite; }
.whale { animation: swim 4.5s ease-in-out infinite; }
@keyframes spout { 0%, 55% { opacity: 0; transform: translateY(3px); } 65% { opacity: 1; transform: translateY(0); } 85%, 100% { opacity: 0; transform: translateY(-3px); } }
@keyframes swim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
.pin .drop, .pin .eye { animation: pin-drop .7s cubic-bezier(.3, 1.5, .6, 1) backwards; animation-delay: calc(var(--i, 0) * .25s + .2s); transform-box: fill-box; transform-origin: 50% 100%; }
.pin .eye { transform-origin: 50% 50%; }
/* 旗子從靠近圖釘的那一端長出來 */
.pin .flag-in { transform-box: fill-box; animation: flag-grow .45s cubic-bezier(.3, 1.4, .6, 1) backwards; animation-delay: calc(var(--i, 0) * .25s + .6s); transition: transform .2s ease; }
.pin .flag-in.from-left { transform-origin: 0% 50%; }
.pin .flag-in.from-right { transform-origin: 100% 50%; }
@keyframes flag-grow { from { opacity: 0; transform: scale(.6); } }
.pin:hover .flag-in, .pin:focus-visible .flag-in { transform: scale(1.06); }
.pin circle.halo { transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; animation-delay: calc(var(--i, 0) * .25s + 1.1s); }
@keyframes pin-drop { from { transform: translateY(-40px); opacity: 0; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(4px); } }
@keyframes halo { 0% { transform: scale(.6); opacity: .45; } 100% { transform: scale(2); opacity: 0; } }
.trip-card .stamp { transition: transform .3s cubic-bezier(.3, 1.5, .6, 1); }
.trip-card:hover .stamp { transform: rotate(-10deg) scale(1.06); }

/* 旅程地圖：圖釘依序彈出 */
.lmk .b { animation: pop .45s cubic-bezier(.3, 1.6, .6, 1) backwards; animation-delay: calc(var(--i, 0) * 70ms + 150ms); }
.lmk .l { animation: fade-up .4s ease-out backwards; animation-delay: calc(var(--i, 0) * 70ms + 300ms); }
@keyframes pop { from { transform: scale(0); } }

@media (prefers-reduced-motion: reduce) {
  .waves path, .boat, .whale, .whale .spout, .pin .drop, .pin .eye, .pin .flag-in, .pin circle.halo, .lmk .b, .lmk .l { animation: none !important; }
  .whale .spout { opacity: 0; }
  .pin .flag-in, .pin .flag rect { transition: none; }
}
.day-date { font-family: var(--font-body); font-size: var(--step--1); color: var(--ink-soft); font-weight: 400; margin-left: 4px; }
.day-note { padding-left: 46px; }
.story-box.highlight h3 { color: var(--mango-ink); }
.story-box.highlight .howto { margin-top: 6px; }
.stop.again { align-items: center; }
.stop.again::before { top: 30px; }
.dot.again { background: transparent !important; color: var(--ink-soft); border: 2px dashed var(--line); font-size: 0.9rem; }
.again-link { font: inherit; font-size: var(--step--1); color: var(--ink-soft); background: none; border: 0; padding: 4px 10px 14px; text-align: left; cursor: pointer; }
.again-link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
footer.foot { margin-top: auto; font-size: 0.75rem; color: var(--ink-soft); }

/* SVG map styling */
.waves path { fill: none; stroke: var(--sea-line); stroke-width: 1; }
.mapbox.tw { background: var(--sea); }
.land-shadow { fill: var(--sea-line); opacity: .55; }
.county { fill: var(--land); stroke: var(--card); stroke-width: 1.1; stroke-linejoin: round; transition: fill .2s; }
.county:hover { fill: var(--land-hover); }
.county.visited { fill: url(#hatch); stroke: var(--mango); stroke-width: 1.6; }
.hatch-bg { fill: var(--mango-soft); }
.hatch-line { stroke: var(--mango); stroke-width: 2; opacity: .55; }
.county-label { fill: var(--ink-soft); font-size: 10.5px; font-family: var(--font-display); text-anchor: middle; dominant-baseline: central; pointer-events: none; letter-spacing: .1em; }
.county-label.on { fill: var(--mango-ink); font-weight: 700; font-size: 12px; }
.pin .drop { fill: var(--mango); stroke: var(--card); stroke-width: 2; }
.pin .eye { fill: var(--card); }
.pin .flag rect { fill: var(--card); stroke: var(--mango); stroke-width: 1.5; transition: stroke .2s ease, stroke-width .2s ease, fill .2s ease; }
.pin .flag text { fill: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 13px; }
.pin:hover .flag rect, .pin:focus-visible .flag rect { fill: var(--mango-soft); stroke: var(--mango-ink); stroke-width: 2.2; }
.pin:focus { outline: none; }
.cartouche .c-title { fill: var(--ink-soft); font-size: 12px; font-family: var(--font-display); letter-spacing: .15em; }
.cartouche .c-num { fill: var(--mango-ink); font-size: 30px; font-family: var(--font-display); font-weight: 700; }
.cartouche .c-of { fill: var(--ink-soft); font-size: 16px; }
.compass .rose-ring { fill: none; stroke: var(--ink-soft); stroke-width: 1; stroke-dasharray: 2 3; }
.compass .rose { fill: var(--card); stroke: var(--ink-soft); stroke-width: 1; }
.compass .rose-n { fill: var(--mango); }

.land { fill: var(--card); stroke: var(--ink-soft); stroke-width: 1.4; stroke-linejoin: round; }
.sea-lines line { stroke: var(--line); stroke-width: 1; }
.city-dot { fill: var(--ink-soft); }
.city-label { fill: var(--ink-soft); font-size: 12px; font-family: var(--font-body); }
.pin-label { fill: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 15px; }
.pin { cursor: pointer; }
.pin circle.halo { fill: var(--mango); opacity: .22; }
.pin circle.core { fill: var(--mango); stroke: var(--card); stroke-width: 3; }
.grid-line { stroke: var(--line); stroke-width: 1; }
.route-line { fill: none; stroke: var(--mango); stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; }
.marker { cursor: pointer; }
.marker .bg { stroke: var(--card); stroke-width: 3; }
.marker text.glyph { fill: #fff; font-family: var(--font-display); font-weight: 700; font-size: 14px; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.marker text.lbl { fill: var(--ink); font-size: 12.5px; font-family: var(--font-body); font-weight: 500; paint-order: stroke; stroke: var(--paper-2); stroke-width: 4px; stroke-linejoin: round; }
.marker.active .bg { stroke: var(--mango); stroke-width: 4; }
.scale text, .compass text { fill: var(--ink-soft); font-size: 11px; font-family: var(--font-body); }
.scale line, .compass path { stroke: var(--ink-soft); stroke-width: 1.5; fill: none; }
.offmap text { fill: var(--ink-soft); font-size: 12px; font-family: var(--font-body); }
.offmap path { stroke: var(--ink-soft); stroke-width: 1.5; fill: none; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .stage {
    position: relative; top: 0; height: 52vh; min-height: 320px; order: -1;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 0;
  }
  .story {

const story = document.getElementById("story");
const mapbox = document.getElementById("mapbox");
const mapNote = document.getElementById("mapNote");
let activePlace = null;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const gmap = p => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.address || (p.area ? p.name + " " + p.area : p.name));

function brandHTML() {
  return `<header class="brand">
    <h1><span class="m">芒果</span><span class="p">鳳梨</span>散步地圖</h1>
    <p class="tag">帶孩子旅行，把世界變成故事</p>
    <p class="motto">走在巷弄與騎樓下，看風景、聽聲音、聞味道，把沿途遇見的人事物記下來。少則得，多則惑。</p>
  </header>`;
}

/* ---------- 總覽 ---------- */
// 行程順序：步行路線（route）或逐日行程（days），編號跨天連續
const sid = s => typeof s === "string" ? s : s.id;
const seqOf = t => [...new Set((t.route ? t.route.stops : (t.days || []).flatMap(d => d.stops)).map(sid))];
const byNewest = () => [...TRIPS].sort((a, b) => b.start.localeCompare(a.start));

function renderOverview() {
  activePlace = null;
  const cards = byNewest().map(t => `
    <li><button class="trip-card" data-trip="${t.id}" id="card-${t.id}">
      <span class="stamp" aria-hidden="true">${esc(t.stamp)}</span>
      <h3>${esc(t.title)}</h3>
      <span class="meta">${esc(t.region)}・${esc(t.dates)}・${esc(t.length)}</span>
      <p class="hook">${esc(t.hook)}</p>
    </button></li>`).join("");
  story.innerHTML = `${brandHTML()}
    <p class="section-label">我們走過的地方・${TRIPS.length} 趟</p>
    <ul class="trip-list">${cards}</ul>
    <p class="empty-hint">下一趟旅行回來，這裡會多一張卡片。</p>
    <footer class="foot">點卡片進入旅程，可以看到步行路線地圖和沿途的小故事。</footer>`;
  story.querySelectorAll("[data-trip]").forEach(b => b.addEventListener("click", () => go(b.dataset.trip)));
  drawTaiwan();
  mapNote.textContent = "點地圖上的橘色圓點，或左邊的卡片，看那一趟的故事。";
  whenIdle(() => loadMapLib().catch(() => {}));
}

function drawTaiwan() {
  const { W, H, minLon, maxLat, k, s, counties } = TW;
  const P = (lon, lat) => [(lon - minLon) * k * s, (maxLat - lat) * s];
  const visited = new Set(TRIPS.map(t => t.county));
  const hideLabel = new Set(["新竹市", "嘉義市"]);
  const short = n => n.replace(/(縣|市)$/, "");
  let waves = "";
  // 波浪畫得比地圖範圍大很多，搭配 svg 的 overflow: visible，讓海面鋪滿整個地圖框
  const x0 = -W * 3, x1 = W * 4;
  for (let y = 18 - 22 * Math.ceil(H * 2 / 22); y < H * 3; y += 22) {
    let d = `M ${x0} ${y}`;
    for (let x = x0; x < x1; x += 20) d += ` q 5 -3 10 0 t 10 0`;
    waves += `<path class="${(Math.round(y / 22) % 2) ? "w-a" : "w-b"}" d="${d}"/>`;
  }
  const shapes = counties.map(c => `<path class="county${visited.has(c.name) ? " visited" : ""}" d="${c.d}"><title>${c.name}</title></path>`).join("");
  const shadow = counties.map(c => c.d).join("");
  const labels = counties.filter(c => !hideLabel.has(c.name) || visited.has(c.name)).map(c =>
    `<text class="county-label${visited.has(c.name) ? " on" : ""}" x="${c.c[0]}" y="${c.c[1]}">${short(c.name)}</text>`).join("");
  // 依旅行日期先後排序，--i 控制每根圖釘與旗子依序出現
  const pins = [...TRIPS].sort((m, n) => m.start.localeCompare(n.start)).map((t, i) => {
    const [x, y] = P(t.pin.lon, t.pin.lat);
    const fw = (t.pin.label.length + 1) * 16 + 92, left = t.pin.flag === "left";
    // 外層 g 只負責定位（SVG transform 屬性）；內層 .flag-in 只負責動畫，兩者互不覆蓋
    return `<g class="pin" data-trip="${t.id}" tabindex="0" role="button" aria-label="${esc(t.title)}" style="--i:${i}">
      <circle class="halo" cx="${x}" cy="${y}" r="16"/>
      <path class="drop" d="M ${x} ${y} c -3 -7 -10 -11 -10 -19 a 10 10 0 1 1 20 0 c 0 8 -7 12 -10 19 z"/>
      <circle class="eye" cx="${x}" cy="${y - 19}" r="4"/>
      <g class="flag" transform="translate(${left ? x - 16 - fw : x + 16} ${y - 34})">
        <g class="flag-in ${left ? "from-right" : "from-left"}"><rect rx="8" width="${fw}" height="26"/>
        <text x="10" y="18">${esc(t.pin.label)}・${t.start.slice(0, 4)}/${+t.start.slice(5, 7)}</text></g></g></g>`;
  }).join("");
  const total = counties.length, done = visited.size;
  const [bx, by] = P(120.08, 24.45), [wx, wy] = P(121.93, 23.35);
  const critters = `
    <g transform="translate(${bx} ${by})"><g class="boat">
      <path class="hull" d="M-10 0 h20 l-4 5 h-12 z"/>
      <path class="mast" d="M0 0 V-16"/>
      <path class="sail" d="M1.5 -15 L10 -2 H1.5 z"/><path class="sail" d="M-1.5 -12 L-8 -2 H-1.5 z"/>
    </g></g>
    <g transform="translate(${wx} ${wy})"><g class="whale">
      <path class="spout" d="M-2 -13 v-5 M-5 -12 l-3 -4 M1 -12 l3 -4"/>
      <path class="body" d="M-13 0 q1 -10 13 -10 q11 0 13 7 q3 -7 8 -7 q-1 6 -5 9 q-10 9 -29 1z"/>
      <circle class="eye-w" cx="-6" cy="-4" r="1.2"/>
    </g></g>`;
  destroyMap();
  mapbox.classList.add("tw");
  mapbox.innerHTML = `<svg viewBox="-20 -10 ${W + 40} ${H + 20}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="台灣旅程地圖">
    <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" class="hatch-bg"/><line x1="0" y1="0" x2="0" y2="6" class="hatch-line"/></pattern></defs>
    <g class="waves">${waves}</g>
    ${critters}
    <path class="land-shadow" d="${shadow}" transform="translate(5 6)"/>
    ${shapes}${labels}${pins}
    <g class="cartouche" transform="translate(4 14)">
      <text class="c-title" x="0" y="0">走過的縣市</text>
      <text class="c-num" x="0" y="34">${done}<tspan class="c-of"> / ${total}</tspan></text>
    </g>

function renderTrip(t) {

let gmap2 = null, gmarkers = {}, currentTrip = null;
function isDark() {
  const r = document.documentElement.getAttribute("data-theme");
  return r ? r === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
function destroyMap() { clearInterval(dashTimer); if (gmap2) { gmap2.remove(); gmap2 = null; gmarkers = {}; } }

// 路線虛線緩緩前進，像在走路（減少動態設定時不動）
// 虛線圖樣：實線 0.6、間隔 2.2（以線寬為單位），每一步把圖樣往前推 0.35
const DASH_SEQ = Array.from({ length: 8 }, (_, k) => {
  const o = k * 0.35;
  return o < 0.6 ? [0.6 - o, 2.2, o, 0] : [0, 2.2 - (o - 0.6), 0.6, o - 0.6];
});
let dashTimer = null;
function animateRoute() {
  clearInterval(dashTimer);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let i = 0;
  dashTimer = setInterval(() => {
    if (!gmap2 || !gmap2.getLayer("route")) { clearInterval(dashTimer); return; }
    i = (i + 1) % DASH_SEQ.length;
    gmap2.setPaintProperty("route", "line-dasharray", DASH_SEQ[i]);
  }, 110);
}
function addRoute(t) {
  const byId = Object.fromEntries(t.places.map(p => [p.id, p]));
  if (!t.route) {  // 逐日行程：每天一條細實線，依序芒果色、鳳梨綠、藍色
    (t.days || []).forEach((d, i) => {
      const id = "day-" + i;
      const coords = d.stops.map(st => byId[sid(st)]).filter(p => p && p.lon != null && !p.offMap).map(p => [p.lon, p.lat]);
      if (gmap2.getSource(id) || coords.length < 2) return;
      gmap2.addSource(id, { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: coords } } });
      gmap2.addLayer({ id, type: "line", source: id, layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": [isDark() ? "#f0a944" : "#e8962a", isDark() ? "#7bbf88" : "#3d7a4c", isDark() ? "#79a8d6" : "#3f74a6"][i % 3], "line-width": 2.5, "line-opacity": 0.75 } });
    });
    return;
  }
  const coords = t.route.stops.map(id => [byId[id].lon, byId[id].lat]);
  if (gmap2.getSource("route")) return;
  gmap2.addSource("route", { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: coords } } });
  gmap2.addLayer({ id: "route-glow", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": isDark() ? "#f0a944" : "#e8962a", "line-width": 10, "line-opacity": 0.18 } });
  gmap2.addLayer({ id: "route", type: "line", source: "route", layout: { "line-cap": "butt", "line-join": "round" },
    paint: { "line-color": isDark() ? "#f0a944" : "#e8962a", "line-width": 4, "line-dasharray": DASH_SEQ[0] } });
  animateRoute();
}

  // 縮小時（手機或景點分散的旅程）只顯示編號圖釘，放大或點選後才顯示地名，避免標籤擠在一起
  const syncLabels = () => mapbox.classList.toggle("compact-labels", (narrow && gmap2.getZoom() < 15.2) || gmap2.getZoom() < 13.8);
  gmap2.on("zoom", syncLabels); syncLabels();
  gmap2.once("load", () => { const a = mapbox.querySelector(".maplibregl-ctrl-attrib"); if (a) a.classList.remove("maplibregl-compact-show"); });
}

function retheme() {
  if (!gmap2) return;
  gmap2.setStyle(appleStyle(MAP_THEMES[isDark() ? "dark" : "light"]));
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", retheme);
new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function haversine(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function setActive(id, scroll) {
  activePlace = id;
  document.querySelectorAll(".place").forEach(el => el.classList.toggle("active", el.dataset.place === id));
  document.querySelectorAll(".lmk").forEach(el => el.classList.toggle("active", el.dataset.place === id));
  if (gmap2 && gmarkers[id]) {
    // 手機上地圖在頁面最上方：從清單點地點時，先捲回地圖讓人看到移動
    if (!scroll && matchMedia("(max-width: 820px)").matches) {
      window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }
    const ll = gmarkers[id].getLngLat();
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    gmap2.easeTo({ center: ll, zoom: Math.max(gmap2.getZoom(), 15.5), duration: reduce ? 0 : 700 });
    Object.entries(gmarkers).forEach(([k, m]) => { m.getElement().style.zIndex = k === id ? 5 : 1; });
  }
  if (scroll) {
    const el = document.getElementById("place-" + id);
    if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
  }
}

/* ---------- 路由（#trip-xxx） ---------- */
function go(id) { location.hash = id ? "trip-" + id : ""; if (!id) route(); }
function route() {
  const h = location.hash.replace(/^#/, "");
  const t = h.startsWith("trip-") ? TRIPS.find(x => x.id === h.slice(5)) : null;
  if (t) renderTrip(t); else renderOverview();
}
window.addEventListener("hashchange", route);
route();
</script>
